services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    # No ports:/expose: — Coolify's Traefik owns the routing (the bare
    # SERVICE_FQDN declaration tells it the container listens on 8000 and
    # makes Coolify write its own labels; do not add labels: here).
    environment:
      - SERVICE_FQDN_MCP_8000
      - EVOLUTION_REMOTE_PUBLIC_URL=${EVOLUTION_REMOTE_PUBLIC_URL:?}
      - EVOLUTION_REMOTE_SECRET_KEY=${EVOLUTION_REMOTE_SECRET_KEY:?}
      - EVOLUTION_REMOTE_OPENAI_CHALLENGE=${EVOLUTION_REMOTE_OPENAI_CHALLENGE:-}
      - EVOLUTION_REMOTE_PUBLISHER=${EVOLUTION_REMOTE_PUBLISHER:-}
      - EVOLUTION_REMOTE_SUPPORT_EMAIL=${EVOLUTION_REMOTE_SUPPORT_EMAIL:-}
      - EVOLUTION_REMOTE_ALLOWED_INTEGRATIONS=${EVOLUTION_REMOTE_ALLOWED_INTEGRATIONS:-}
    volumes:
      - mcp_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  mcp_data:
